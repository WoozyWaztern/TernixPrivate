<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ternix - Playing</title>
    <link rel="shortcut icon" href="images/ternixLogo.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/"
        }
    }
    </script>
    <style>
        #mp-loading {
            position: fixed; inset: 0; background: rgba(0,0,0,0.78); z-index: 5000;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            color: #fff; font-family: Arial, sans-serif; font-size: 16px; text-align: center; gap: 8px;
        }
        #disc-overlay {
            display: none; position: fixed; inset: 0; z-index: 99999;
            background: rgba(30,30,30,0.75);
            align-items: center; justify-content: center;
        }
        #disc-overlay.show { display: flex; }
        #disc-overlay.scary { background: rgba(0,0,0,0.9); }
        #disc-box {
            background: rgba(50,50,50,0.92);
            border: 2px solid #333;
            color: #eee;
            font-family: Arial, Helvetica, sans-serif;
            padding: 28px 32px;
            max-width: 400px;
            width: 88%;
            text-align: center;
            box-shadow: 0 8px 28px rgba(0,0,0,0.45);
        }
        #disc-overlay.scary #disc-box {
            background: rgba(28,0,0,0.96);
            border-color: #500;
        }
        #disc-code { font-size: 22px; font-weight: bold; margin-bottom: 12px; color: #ff6b6b; }
        #disc-overlay.scary #disc-code { color: #ff2020; font-size: 24px; }
        #disc-msg { font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
        #disc-ok {
            margin-top: 18px; padding: 8px 22px; cursor: pointer;
            border: 1px solid #555; background: #ddd; font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="game-ui">
        <div id="chat-messages"></div>
        <div id="chat-bar">
            <div id="chat-placeholder">Click here or press / to chat</div>
            <input type="text" id="chat-input" maxlength="120" autocomplete="off" spellcheck="false">
        </div>
        <button id="game-exit">Exit</button>
    </div>
    <div id="mp-loading">
        <div>Loading...</div>
        <div style="font-size:12px;opacity:0.75">Connecting to game</div>
    </div>
    <div id="disc-overlay">
        <div id="disc-box">
            <div id="disc-code"></div>
            <div id="disc-msg"></div>
            <button type="button" id="disc-ok">OK</button>
        </div>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB_ypIESl-KCx-FDJrUrhdgE92O1uaMr8k",
            authDomain: "ternix-13694.firebaseapp.com",
            databaseURL: "https://ternix-13694-default-rtdb.firebaseio.com",
            projectId: "ternix-13694",
            storageBucket: "ternix-13694.firebasestorage.app",
            messagingSenderId: "433433684244",
            appId: "1:433433684244:web:c52b6eb37204b7b1f6ba01",
            measurementId: "G-VM8PCVDMRW"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        window.ternixDB = firebase.database();
    </script>
    <script type="module" src="play.js"></script>
</body>
</html>
